instructions: |
  ## Gate policy

  **CI is the gate.** Every pull request runs `root-suite-affected` in four parallel
  shards plus each backend tier (`backend-python`, `backend-java`, `backend-go`,
  `backend-rust`, `backend-typescript`, `backend-wasm`), and also `lint`,
  `census-artifact`, `gate-wasm`, `held-out`, and `merged-prs-landed`, on dedicated
  machines. Read the verdict with `gh pr checks <n>`.

  - **Do not run `tools/pre_merge.sh` or a full `pytest tests/` locally.** They duplicate
    CI, take tens of minutes, and starve every other lane running on the same machine.
  - Run narrow selections only — `pytest <specific test file(s)>` — from an
    **out-of-tree** virtualenv. An in-tree `.venv` makes the tooling resolve a different
    interpreter than the one under test and produces false collection errors.
  - `tools/affected_tests.py` is bounded by `git merge-base` and includes the working
    tree, so a `FULL` verdict means *your own diff*, or a path it has no mapping for
    (for example the generated `crates/revl-gate/src/selfhost.rs`) — never that `main`
    is broken.

  ## Working across worktrees

  - **Do not run `git stash`.** The stash is shared by every worktree of this repository,
    so a `stash push` in one lane can later pop another lane's entry. Use a scratch clone
    under `/private/tmp` when you need a pristine tree.
  - Stay inside your own session worktree. Do not read or write another worktree's files.
  - Do not `git rebase`, force-push, or delete branches; merge `origin/main` when the
    update is needed rather than rebasing onto it.
  - Do not use `apply_patch` here — patches fail to parse in this repository. Use the
    `edit` tool or a script.

  ## Generated artifacts

  - Never hand-edit `docs/census-artifact/**` or
    `tests/fixtures/census_crate_reproduction/**`; they are generator-owned.
  - The census digest covers the checker sources, so **merge `origin/main` first and
    record once**, immediately before the final push. Recording before merging produces
    a record for a mixed tree and fails the `census-artifact` check.

  ## Pull requests

  - **Never weaken, skip, or delete a test to make a gate pass.** If a test opposes the
    change, say so and report it instead.
  - Report the pull request number, the head sha, and the narrow-test evidence. Unless
    you have been asked to land the work, do not merge the pull request and do not
    enable auto-merge; the merge-gate owner lands it.
