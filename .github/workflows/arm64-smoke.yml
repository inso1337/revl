name: arm64-smoke

# arm64 architecture coverage on a self-hosted aarch64 runner (the Oracle box,
# labels: self-hosted,linux,arm64,offload). GitHub's ubuntu-latest is x86_64, so
# nothing else exercises revl on arm64. This lane proves revl's dependency tree
# and core compiler build+run on aarch64, where an x86-only wheel or a
# pointer-width assumption would break. It is DELIBERATELY not a PR gate: it runs
# on main + a nightly schedule (and on demand), on a lane separate from the x86
# runners, so it adds coverage and capacity without slowing any PR.
#
# Python comes from uv (not actions/setup-python): the box is Ubuntu 20.04 and
# setup-python@v5 has no 3.11 arm64 build for 20.04, so it always failed. uv
# provides a standalone 3.11 on any distro/arch and is pre-installed on the box.
on:
  push:
    branches: [main]
    # Issue #2872: only a push that can change what the job below runs. The
    # job installs the package (`pyproject.toml`, `hatch_build.py`) and runs
    # three test files against the compiler, which reads `stdlib/` and
    # `backends/` off the checkout at run time and compiles `selfhost/`. The
    # tests import helpers from `tests/_*.py` and one case table from a sibling
    # test, and read corpora under `tests/fixtures/`, `tests/noncensus_corpus/`,
    # `examples/` and three `bench/` documents. A push touching none of these
    # (docs, crates, formal, the rest of bench and tools, other tests) runs the
    # same tests on the same inputs, so it only queues. The nightly schedule
    # below still runs the lane on every tree.
    # `tests/test_workflow_path_filters_2872.py` derives these inputs from the
    # job and the test files and reds when one is missing here: add an input
    # to the job, add it here.
    paths:
      - "src/**"
      - "stdlib/**"
      - "selfhost/**"
      - "backends/**"
      - "tests/fixtures/**"
      - "tests/noncensus_corpus/**"
      # the corpus lists reach these with `../../../` names
      - "examples/**"
      - "bench/codegen/go/probe2.rvl"
      - "bench/codegen/python/programs/maps.rvl"
      - "bench/results/rerun-deepseek-v4-pro-20260826/12-replicator/v2/attempt-1.rvl"
      - "tests/_*.py"
      - "tests/conftest.py"
      - "tests/test_v2_emit.py"
      - "tests/test_selfhost_lower_ir.py"
      - "tests/test_selfhost_emit_py.py"
      # imported by test_selfhost_emit_py.py for its cases
      - "tests/test_py_comment_only_blocks_2284.py"
      - "conftest.py"
      - "pyproject.toml"
      - "hatch_build.py"
      - ".github/workflows/arm64-smoke.yml"
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

# Least privilege: the smoke job only checks out and runs tests.
permissions:
  contents: read

concurrency:
  group: arm64-smoke-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  frontend-arm64:
    runs-on: [self-hosted, linux, arm64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: install revl + run frontend/self-host oracles (arm64, uv py3.11)
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[test]"
          PYTHONPATH=src .venv/bin/python -m pytest tests/test_v2_emit.py tests/test_selfhost_lower_ir.py tests/test_selfhost_emit_py.py -q
