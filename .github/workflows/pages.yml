# Deploy site/ to GitHub Pages (https://inso1337.github.io/revl/).
#
# THE COMPILER WHEEL IS BUILT HERE, AND IS NOT COMMITTED.
#
# `site/js/playground.js` boots the compiler under Pyodide from
# `site/vendor/revl-<version>-py3-none-any.whl`, a wheel that vendors the whole
# of `src/revl` plus the py tier's top-level modules. It used to be committed
# and gated post-merge by `.github/workflows/site-wheel.yml`. That gate worked
# and told the truth; the artifact could not keep up with it. A wheel built for
# one sha is stale by the time its refresh lands several merges later, so `site
# wheel drift` was refreshed four times in one day and red again after each.
# `tools/check_site_wheel.py`'s header records the full weighing, including why
# a per-PR regeneration is worse here (a 2.5 MB non-deterministic zip is a merge
# conflict by construction, and this repo lands through a merge queue) and what
# the committed copy has already cost (49.3 MiB of the repo's 66.0 MiB of packed
# blob data, over 191 revisions).
#
# Building it in this job removes the possibility rather than detecting it: the
# published playground is built from the sha being published, always, with no
# step anyone has to remember, no credential, and nothing asked of PR authors.
# `site/js/examples.js` is regenerated here for the same reason and at the same
# cost — its committed copy lags `examples/*.rvl` by the same mechanism.
#
# THE GATE/REFERENCE CENSUS IS PUBLISHED HERE TOO (issue #1268), AND IS ALSO
# NOT COMMITTED.
#
# `tools/publish_census_artifact.py` renders `site/census-artifact/` — an HTML
# page, a markdown copy, the `EVAL-REPORT-1` JSON, and a sha256 manifest — from
# `docs/census-artifact/`, the committed census records. The records are the
# input; the edition is a function of the sha being deployed, so a reader always
# lands on the numbers of the tree that is up, and nothing has to be remembered
# or refreshed by hand. One consequence worth stating: `--verify --strict`'s
# guarantee is inherited rather than duplicated — rendering hydrates the records
# against the checkout and refuses (`StaleRecords`) when a pinned input moved, so
# this job fails loudly instead of publishing numbers the tree no longer
# produces. The `census-artifact` job in `ci.yml` is what holds that on the way
# in.
#
# Unlike the wheel build this step is not stdlib-only, and the one `pip install`
# below is why: the edition is rendered by the same code path `--verify --strict`
# runs, which imports the reference classifier from `tests/test_selfhost_lower.py`
# rather than copying it, and that module imports pytest.
#
# The one new way to be wrong is this job silently ceasing to build the wheel or
# the census edition, or building one under a name the page does not fetch.
# `tools/check_site_wheel.py` reads this file for exactly that (and
# `site-wheel.yml` still runs it post-merge on main and weekly), and
# `tests/test_publish_census_artifact.py` reads it for the census step, so
# deleting a build step below is a red, not a 404.
name: pages

on:
  # No `paths:` filter. The deployed artifact is now a function of `src/revl/**`,
  # `backends/python/*.py`, `pyproject.toml`, the builder and `examples/**` as
  # well as of `site/**`; a filter listing those is one more thing that can be
  # silently wrong, and it was a `site/**`-only filter that made the committed
  # wheel the only thing that ever refreshed the published compiler. The job is
  # a checkout plus a stdlib zip build, and the `pages` concurrency group below
  # collapses a burst of merges into one deployment.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # No `pip install`: playground/build_wheel.py is stdlib-only and reads
      # src/revl off the checkout, so this needs no revl install and no backend
      # toolchain. It MUST stay ahead of the upload step — an upload of a
      # directory built afterwards publishes the checkout, which has no wheel.
      - name: build the compiler wheel and examples into site/
        run: |
          python3 tools/check_site_wheel.py --write
          python3 site/gen_examples.py
      # The census edition, built from the sha being deployed (see the header).
      # `--verify --strict` runs FIRST and is the point of the step: the page
      # then publishes numbers this job recomputed from this tree, not numbers
      # it merely re-serialised from records that a moved input has quietly
      # outlived. It costs about two minutes, it is the same verdict
      # `ci.yml`'s `census-artifact` job holds on the way in, and its exit 0 is
      # what makes the published `reproduced` a claim about the deployed sha.
      # The `pip install` is the only install in this job: the reference
      # classifier is imported from `tests/test_selfhost_lower.py` rather than
      # copied, and that module imports pytest. It installs into the runner's
      # site-packages, outside `site/`, so nothing it adds is uploaded.
      - name: build the gate/reference census edition into site/
        run: |
          python3 -m pip install --quiet -e . pytest
          python3 tools/census_artifact.py --verify --strict
          python3 tools/publish_census_artifact.py --write
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
