name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
    # Issue #1817: a push that changes only documentation has no code to scan.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: '40 14 * * 0'
  workflow_dispatch:

# NOT run on pull_request, deliberately. Six language lanes per PR made CodeQL
# roughly half of every queued job on a repository whose runner concurrency is
# the throughput limit, and the ci workflow (which IS required for merge) was
# queuing behind scans of code that had not landed yet. Everything that reaches
# main is still scanned by a later push (see the concurrency note below) or the
# weekly schedule, so no landed code goes unscanned; what is lost is the
# pre-merge signal on a PR branch.
# `workflow_dispatch` is here so a scan can be run on demand against a branch
# when a change warrants it before merge.

concurrency:
  # Issue #1817: one group per ref, so a burst of merges to main collapses. With
  # cancel-in-progress false GitHub keeps at most one running analysis and one
  # pending one, and a newer push replaces the pending one: the running scan
  # always finishes, and the next scan is of the newest commit, which contains
  # every commit it replaced. Cancelling the running scan as well could starve
  # CodeQL while merges arrive faster than a queued scan starts and finishes.
  # The group used to carry the SHA on push, so every merge queued its own six
  # lanes (about 13 runner-minutes) on a repository whose runner concurrency is
  # the throughput limit. What is given up is a verdict for each intermediate
  # commit; what each scan covers is unchanged, since a scan reads the tree.
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      packages: read
      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: go
          build-mode: autobuild
        - language: java-kotlin
          build-mode: none
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none
        - language: rust
          build-mode: none
        # Tailored to what this repository actually contains (tracked file
        # counts at the time of writing): 555 .py, 93 .ts, 66 .go, 22 .rs,
        # 22 .java, 12 .js/.mjs, plus the workflows themselves.
        #
        # `c-cpp` is deliberately ABSENT. The only C in the tree is
        # tree-sitter-revl/src/{parser.c,scanner.c} and its three
        # tree_sitter/*.h headers, which are GENERATED tree-sitter output
        # vendored into the repo. Scanning generated parser tables produces
        # findings nobody can act on without regenerating upstream, and a
        # scanner people learn to ignore is worse than no scanner. Add the
        # lane if hand-written C ever lands.
        #
        # `swift`, `csharp` and `ruby` are absent because the repository has
        # no such sources. Note that if a lane is added for a language with
        # no files, CodeQL fails the job rather than skipping it.
        #
        # go is `autobuild` because CodeQL REFUSES `none` for Go: the first
        # run failed with "Go does not support the none build mode". This
        # tree has FIVE independent go modules (backends/go/placement_runner,
        # backends/go/scenarios, backends/go/v3, bench/codegen/go and
        # forks/stc-go) and no root module.
        #
        # MEASURED PARTIAL COVERAGE, do not read this lane's green as full.
        # The first successful run warned: package `revl.goplacement/emitted`
        # could not be found. That is BY DESIGN and not fixable by a build
        # step: `backends/go/placement_runner/emitted/*.go` is generated per
        # COMPOSITION by `backends/go/emit.py` at `revl run --placement`
        # build time and is gitignored (only `.gitkeep` is tracked). So a
        # fresh checkout has no such package, `main.go` imports it, and
        # CodeQL analyses that file only partially.
        #
        # What that costs: `placement_runner/main.go` is the seam-handling
        # entry point, so the correlation guard (roadmap 421 F8) and the
        # seam address judgement (337) live behind a partially-resolved
        # import. `bridge/bridge.go` and the other four modules are analysed
        # normally.
        #
        # Not worth "fixing" by generating a synthetic emitted package: the
        # emitted code differs per composition, so a scan of one instance
        # reports on generated output rather than on the runner, which is
        # coverage theatre. If the placement runner ever needs real scanning,
        # the honest route is a `manual` build that emits a REPRESENTATIVE
        # composition and says which one, in the workflow, so a reader knows
        # what was covered.
        #
        # Every other lane is `build-mode: none`, which analyses every
        # tracked source file with no build. That matters for rust in
        # particular: a build there resolves pinned cordis-rs from the
        # registry, and a scanner that can go red on a network hiccup gets
        # muted.

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

    - name: Initialize CodeQL
      uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # `security-extended` over the default suite: this repository is a
        # compiler whose own roadmap records executed reproducers for
        # injection, path-traversal and confinement defects (items 416, 421,
        # 422, 425, 428), so the extra precision is worth the extra noise.
        # `security-and-quality` is deliberately not used: the quality rules
        # would bury the security findings, and the repository already gates
        # style with ruff.
        queries: security-extended

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
      with:
        category: "/language:${{matrix.language}}"
