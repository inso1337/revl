name: publish

# Cut releases FROM TAGS ONLY. This workflow must never publish on a push to
# main — it triggers exclusively on a version tag, so a merge to main can never
# ship a release by itself. A maintainer publishes by pushing a `v*` tag:
#
#     git tag v2.0.1 && git push origin v2.0.1
#
# The publish is gated on the full CI suite (the same one that gates main),
# re-run on the tagged commit: a version on PyPI is a claim that suite passed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Re-run the exact matrix that gates main, on the tagged commit. If any tier
  # fails, the publish job below never runs — so a broken tag cannot reach PyPI.
  ci:
    uses: ./.github/workflows/ci.yml

  # Sanity gate: the tag must match the version in pyproject.toml. A tag of
  # v2.0.1 publishing a wheel that says 2.0.0 (or vice versa) is a footgun; fail
  # loudly before building rather than shipping a mislabeled release.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
      - name: Tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(python3 - <<'PY'
          import re, pathlib
          text = pathlib.Path("pyproject.toml").read_text()
          m = re.search(r'^\s*version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          print(m.group(1) if m else "")
          PY
          )
          echo "tag=$tag  pyproject=$proj"
          if [ -z "$proj" ]; then
            echo "::error::could not read version from pyproject.toml"; exit 1
          fi
          if [ "$tag" != "$proj" ]; then
            echo "::error::tag v$tag does not match pyproject version $proj"; exit 1
          fi

  publish:
    needs: [ci, check-version]
    runs-on: ubuntu-latest
    # A dedicated environment lets the maintainer add manual-approval and
    # branch/tag protection rules around every release from the repo settings.
    environment:
      name: pypi
      url: https://pypi.org/project/revl/
    permissions:
      # A job-level block REPLACES the workflow-level one rather than adding to
      # it, so every scope this job needs has to be named here — without the
      # line below `contents` would be `none` and the checkout step could not
      # read the tag it is publishing.
      contents: read
      # OIDC token for PyPI Trusted Publishing — no long-lived secret needed.
      id-token: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build==1.2.2.post1
          python -m build
      - name: Check the built artifacts
        run: |
          python -m pip install twine==7.0.0
          twine check dist/*
      # The last thing between this runner's filesystem and PyPI.
      #
      # `twine check` reads the metadata and never opens the payload. This
      # asserts the wheel's member list against `git ls-files` of the trees
      # pyproject maps into it: an upload is refused unless the artifact is
      # exactly the tagged commit's contents. Before GHSA-gj88-cx6q-38r2,
      # `pyproject.toml` force-included `backends/` and `stdlib/` verbatim —
      # force-include is exempt from every exclude and from the ignore files —
      # so a build on a runner that had touched the node/cargo/TS-fixture
      # toolchains would have shipped `node_modules`, cargo `target/` and
      # generated key material to PyPI, permanently and irrevocably. A clean
      # runner made that latent rather than absent; this makes it impossible.
      #
      # Deliberately placed BEFORE the publish step, and with no `if:` guard: a
      # release that cannot prove what it contains is not a release.
      - name: The wheel ships exactly the tagged commit's files
        run: python3 tools/check_wheel_manifest.py dist/*.whl
      # Trusted Publishing (OIDC) — the recommended path, no API token stored.
      #
      # MAINTAINER TODO (one-time, before the first release):
      #   Configure a Trusted Publisher on PyPI for the `revl` project:
      #   PyPI → project `revl` → Settings → Publishing → Add a pending/trusted
      #   publisher with
      #     owner:        inso1337
      #     repository:   revl
      #     workflow:     publish.yml
      #     environment:  pypi
      #   Until that is set up, this step will fail closed (it will not publish).
      #
      # ALTERNATIVE (API token instead of OIDC): remove the `id-token: write`
      # permission and the two lines are enough — set a `PYPI_API_TOKEN` repo
      # secret and pass it here:
      #     with:
      #       password: ${{ secrets.PYPI_API_TOKEN }}
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1 (v1.14.2)
