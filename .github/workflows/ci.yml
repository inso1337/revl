name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      # the frontend suite includes the pure-Python halves of all three
      # backends (emitter goldens, IR contract, manifest/admission, audit);
      # runtime-integration tests skip cleanly when their host runtime is
      # absent (cordis-py fork, node/cordis, wasmtime, cordisc)
      - run: pytest tests/ -q

  backend-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v4
      - run: sh backends/python/setup.sh
      - run: cd backends/python && .venv/bin/pytest -q
      - run: cd backends/python && .venv/bin/python demo.py

  backend-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd backends/typescript && npm ci
      - run: cd backends/typescript && npx vitest run
      - run: cd backends/typescript && npx tsc --noEmit

  backend-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      # the wasmtime-gated tests (WAT validation, emitted-component execution)
      # used to skip silently here: the runtime was never installed. Pin a
      # release so the wasm tier's runtime coverage is real, not implied.
      - name: Install wasmtime (pinned)
        run: |
          curl -sSfL https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.3/wasmtime-v47.0.3-x86_64-linux.tar.xz -o /tmp/wasmtime.tar.xz
          mkdir -p /tmp/wasmtime
          tar -C /tmp/wasmtime -xJf /tmp/wasmtime.tar.xz
          echo "/tmp/wasmtime/wasmtime-v47.0.3-x86_64-linux" >> "$GITHUB_PATH"
      # the tier's runtime tests live partly in tests/test_wasm_backend.py
      # (the frontend half of the wasm backend) — run both files here.
      - run: pytest backends/wasm/test_v3_emit.py tests/test_wasm_backend.py -q

  backend-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install -e ".[test]"
      - run: pytest backends/rust/test_emit_rust.py -q

  backend-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the javac gate compiles emitted sources against the cordis4j API
      # stubs and runs emitted test blocks on the JVM — without a JDK those
      # tests skip silently, which is how invalid Java once shipped in a
      # golden. Keep the JDK pinned here.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -e ".[test]"
      # real-runtime scenario gate: compile cordis4j-core from source and
      # point the suite at the classes (zero runtime deps, plain javac)
      - run: |
          git clone --depth 1 https://github.com/1na-ko/cordis4j.git /tmp/cordis4j
          find /tmp/cordis4j/cordis4j-core/src/main/java -name '*.java' ! -name 'module-info.java' > /tmp/core-sources.txt
          mkdir -p /tmp/cordis4j-classes
          javac --release 21 -d /tmp/cordis4j-classes @/tmp/core-sources.txt
      - run: pytest backends/java/test_emit_java.py -q
        env:
          REVL_CORDIS4J_CLASSES: /tmp/cordis4j-classes
