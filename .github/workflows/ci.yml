name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Exposed as a reusable workflow so the release job can gate the PyPI publish
  # on the *same* suite that gates main (see .github/workflows/publish.yml).
  # A version on PyPI must be a claim this whole matrix passed. No job below
  # changes; this only lets the workflow be `uses:`-called from the tag build.
  workflow_call:

# One run per branch at a time. Agents push to a PR branch repeatedly while
# iterating, and without this every push stacked another full matrix behind the
# last one: the queue hit 16 runs deep with 2 executing, which made CI the
# bottleneck the whole push-and-let-CI-test workflow exists to remove.
# Superseded PR runs are cancelled because only the newest commit matters.
# Runs on main are NOT cancelled: main's history is the signal, and dropping a
# run there would leave a landed commit with no verdict.
concurrency:
  # The group carries the SHA on push, so a push to main is unique per commit
  # and has nothing to cancel. A pull_request keeps a stable per-ref group, so a
  # new push to the PR cancels the superseded run. Encoding the distinction in
  # the GROUP rather than in cancel-in-progress is deliberate: the expression
  # form cancelled main's runs anyway, which cost three merge commits their
  # verdict.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'pr' }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN, workflow-wide. Every job below only checks
# out the repository and runs tests: none opens an issue, writes a check, pushes
# a commit, uploads a package or requests an OIDC token. The repository default
# is broader than that, so declare the floor here rather than per job — a new
# job inherits it, and a job that genuinely needs more has to say so and be
# reviewed for it. This is also the ceiling when publish.yml `uses:`-calls this
# workflow (a called workflow can only narrow the caller's grants, never widen
# them), which is fine: the tag build's publish job declares its own
# `id-token: write` on itself, not here.
permissions:
  contents: read

# Go module resolution resilience. The go cross-tier tests download the pinned
# stc-go module during `go test`, which intermittently fails verifying it against
# the online checksum database (sum.golang.org stream errors) and reddens CI on a
# network hiccup, not a defect. `-mod=mod` lets go resolve modules; GOSUMDB=off
# skips the online checksum-DB round-trip (the module version is pinned in go.mod,
# and local go.sum verification is unaffected).
env:
  GOFLAGS: -mod=mod
  GOSUMDB: "off"

jobs:
  # roadmap 110d: lint gate. The repo's `# noqa` discipline is F-level
  # (Pyflakes: unused imports/locals, undefined names, empty f-strings) but no
  # job enforced it. Config lives in pyproject [tool.ruff]; ruff is version-
  # pinned so the finding set is reproducible across runs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.4 pyyaml==6.0.2
      - run: ruff check
      # issue #191: every job's EFFECTIVE GITHUB_TOKEN permissions must support
      # the actions that job invokes. A job-level `permissions` block REPLACES
      # the workflow-level one rather than merging into it, and that is how the
      # publish job came to declare `id-token: write` alone -- leaving
      # `contents: none`, so `actions/checkout` could not have read the tag it
      # publishes. The release path never runs on a PR or on main, so a green
      # CI said nothing about it. This reads the workflows instead of running
      # them, which is the only way that job gets checked before a tag exists.
      #
      # The self-test runs FIRST and reintroduces that exact bug into a
      # synthetic workflow, so the gate's own logic is exercised on every PR. A
      # checker that has never been shown to catch anything is the same shape
      # of gap as the one it closes.
      #
      # `--strict` also fails a job with no `permissions` block at any level:
      # its effective set is then the repository default, which this tool
      # cannot see. Every workflow declares a floor as of this branch, so the
      # strict setting is the honest one -- a new job that forgets is a red
      # rather than a note nobody reads.
      - run: python3 tools/check_workflow_permissions.py --self-test
      - run: python3 tools/check_workflow_permissions.py --strict
      # The roadmap's in-progress markers, checked against git: a marker naming
      # a branch that already landed, a branch gone from origin, or a sha not
      # reachable from main is a lie the next reader pays for. Needs no
      # toolchain, so it lives here. Fatal from the start: the reconciliation
      # pass closed the seven landed-branch markers, and the three that survived
      # it (items 392 and 406 naming deleted branches, item 425 F3 citing a sha
      # only on an unmerged branch) were reworded in this same commit.
      # A (contradiction), B (delegation), C (orphan) and E (duplicate
      # headers) are all ON, and all four are GREEN on main as of this merge.
      # C joins the line here: every open or delegated finding in the file now
      # names a branch, an issue, a fix sha or an owner (item 427 F8 is issue
      # #174), so a new unowned finding is a new red rather than one more line
      # in a backlog.
      #
      # D (--check-tier-parity) is the only one still off: it has two real
      # findings on main (items 421 F6 and 422 F6, python-only fixes to a
      # language-wide guarantee). Turn it on here as its findings are
      # dispatched.
      #
      # Never add `|| true`, and never narrow a check to make this line pass.
      # `make roadmap-check-all` runs all five locally.
      - run: |
          python3 tools/check_roadmap_markers.py \
            --check-contradiction \
            --check-delegation \
            --check-duplicate-headers \
            --check-orphan

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # the conformance-validate gate compiles emitted Go against the pinned
      # stc-go (go.mod says `go 1.25.0`). The runner's preinstalled Go is
      # older, and its toolchain auto-download fails under the validator's
      # offline-first probe — pin the same version the backend jobs use.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # `tests/` carries cross-tier probes that EXECUTE emitted Java on a JVM
      # (test_insert_if_absent, test_total_field_surface, and every other
      # `[java]` parameter), and the emitter compiles at `--release 21` because
      # `match` lowers to Java 21 pattern switches. This job pinned no JDK, so
      # those probes met whatever the runner image happened to carry. Same
      # shape, same fix as the Go pin above: without it they do not measure the
      # tier they claim to. The runner-side gate now SKIPS with a reason on an
      # older JDK rather than failing, which makes an unpinned job silently
      # unmeasured -- exactly what roadmap item 445 exists to prevent -- so the
      # pin is what keeps this coverage real.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -e ".[test]"
      # roadmap 328: the README conformance + performance matrix is generated
      # from real emitter output, never authored. Fail the build if the
      # committed block drifts from a fresh generation — the same contract as
      # the other generated-artifact gates. Emit-only + self-host are pure
      # Python, so this needs no backend toolchain and runs here.
      - run: python3 tools/conformance.py --check-readme
      # roadmap 110c: the playground/site wheel freshness is checked by
      # `make pre-merge` (run per merge) and at release, NOT on every push. The
      # wheel vendors the whole of src/revl, so a per-push gate reddened CI on
      # every source change to a bundled module (an outage class, not a defect);
      # it is a deploy artifact, so the check belongs at merge/release time.
      # `python3 tools/check_site_wheel.py --write` rebuilds it.
      # the frontend suite includes the pure-Python halves of all three
      # backends (emitter goldens, IR contract, manifest/admission, audit);
      # runtime-integration tests skip cleanly when their host runtime is
      # absent (cordis-py fork, node/cordis, wasmtime, cordisc)
      - run: pytest tests/ -q

  backend-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4 (v4.2.0)
      - run: sh backends/python/setup.sh
      - run: cd backends/python && .venv/bin/pytest -q
      - run: cd backends/python && .venv/bin/python demo.py
      # roadmap item 419a guard: backends/wasm/ and backends/python/tests/
      # each ship a same-named emit.py; combining the two roots in ONE
      # pytest process used to poison sys.modules['emit'] via a sys.path
      # insertion race (backend-python and backend-wasm above never combine
      # them, which is exactly how this stayed hidden). setup.sh installs
      # this venv editable against the checkout, so it already carries both
      # revl and the cordis-py runtime — run both roots together here so a
      # regression of the conftest.py pin (see backends/python/tests/
      # conftest.py's _load_and_pin, and test_bare_import_pin.py) reds CI
      # immediately instead of silently reappearing. wasmtime is not
      # installed in this job, so the runtime-execution wasm tests skip here
      # (backend-wasm below is what gates those); that is fine, this step
      # exists only to catch the cross-root collision.
      #
      # This step pins ONE pair. The decision behind 419a is broader: the
      # backend roots are co-importable, full stop, and the structural half of
      # it (no two collectable test files under backends/ share a basename, no
      # root grows an __init__.py, the set of same-named backend modules is the
      # one the pin covers) is checked in the root suite by
      # tests/test_backend_suite_roots_combine.py, which needs no toolchain and
      # so covers the tiers this job cannot install.
      - run: cd backends/python && .venv/bin/pytest ../wasm/ tests/ -q

  # The root `tests/` suite, WITH the cordis-py runtime.
  #
  # `pytest tests/ -q` ran in exactly one job (`frontend`), which installs only
  # `pip install -e ".[test]"` and therefore has no cordis-py. Every test in the
  # root suite carrying a `find_spec("cordis") is None` guard therefore skipped
  # in CI and executed NOWHERE: `backend-python` above runs with cwd
  # `backends/python`, so its `tests/` is `backends/python/tests/`, not this
  # suite; `backend-rust` runs one file from here and `conformance` another.
  # Roughly 48 files in tests/ carry that guard.
  #
  # Keep the `frontend` job exactly as it is. It proves a separate and real
  # property: the suite must stay green on a checkout with no runtime at all.
  # This job proves the other half, that the guarded tests actually pass when
  # the runtime IS there.
  frontend-cordis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4 (v4.2.0)
      # This suite's cross-tier probes execute emitted Go against the PINNED
      # stc-go runtime, and they decide whether to run from whether a `go`
      # binary answers on PATH. ubuntu-latest preinstalls one, so without this
      # pin they do not skip: they run against the wrong toolchain and fail the
      # pinned build (64 `[go]` failures the first time this job ran). Same
      # version `backend-go` pins, for the same reason.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # `tests/` carries cross-tier probes that EXECUTE emitted Java on a JVM
      # (test_insert_if_absent, test_total_field_surface, and every other
      # `[java]` parameter), and the emitter compiles at `--release 21` because
      # `match` lowers to Java 21 pattern switches. This job pinned no JDK, so
      # those probes met whatever the runner image happened to carry. Same
      # shape, same fix as the Go pin above: without it they do not measure the
      # tier they claim to. The runner-side gate now SKIPS with a reason on an
      # older JDK rather than failing, which makes an unpinned job silently
      # unmeasured -- exactly what roadmap item 445 exists to prevent -- so the
      # pin is what keeps this coverage real.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # the same one-command setup `backend-python` uses: it clones cordis-py at
      # the pinned revision and installs revl editable beside it, so this venv's
      # interpreter can import both.
      - run: sh backends/python/setup.sh
      # Run from the repo root so `tests/` is THIS suite, and under the venv's
      # python so `import cordis` resolves. The WHOLE suite runs: there is no
      # deselect list and no file narrowing, because the first full run of it
      # under the runtime was already green (398 tests that had never executed
      # anywhere in CI, across 81 modules). Roadmap item 430 records that. If a
      # future failure needs excluding, enumerate it here with a reason and add
      # it to 430 rather than narrowing the path above.
      - run: backends/python/.venv/bin/python -m pytest tests/ -q

  backend-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd backends/typescript && npm ci
      - run: cd backends/typescript && npx vitest run
      - run: cd backends/typescript && npx tsc --noEmit

  backend-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      # the wasmtime-gated tests (WAT validation, emitted-component execution)
      # used to skip silently here: the runtime was never installed. Pin a
      # release so the wasm tier's runtime coverage is real, not implied.
      - name: Install wasmtime (pinned)
        run: |
          curl -sSfL https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.3/wasmtime-v47.0.3-x86_64-linux.tar.xz -o /tmp/wasmtime.tar.xz
          mkdir -p /tmp/wasmtime
          tar -C /tmp/wasmtime -xJf /tmp/wasmtime.tar.xz
          echo "/tmp/wasmtime/wasmtime-v47.0.3-x86_64-linux" >> "$GITHUB_PATH"
      # installing the runtime is only half of it: if the download ever
      # breaks, the tests would go back to skipping and the job would still
      # be green. Prove the binary is there, then make its absence fatal.
      - run: wasmtime --version
      # the tier's runtime tests live partly in tests/test_wasm_backend.py
      # (the frontend half of the wasm backend) — run both files here.
      - run: pytest backends/wasm/test_v3_emit.py tests/test_wasm_backend.py -q --junitxml=/tmp/wasm-junit.xml
        env:
          # turns "wasmtime not installed" from a silent skip into a failure;
          # unset locally, so offline dev still skips cleanly
          REVL_REQUIRE_WASMTIME: "1"
      # belt and braces, and it covers the whole tier rather than only the
      # file that reads the flag: this job must not skip a single test.
      - name: no wasm test may skip in CI
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          report = pathlib.Path("/tmp/wasm-junit.xml")
          if not report.is_file():
              print("::error::pytest wrote no junit report - the run did not start")
              sys.exit(1)
          text = report.read_text(encoding="utf-8", errors="replace")
          # The guard exists for WASMTIME coverage. One skip is legitimately
          # about a *different* optional runtime - the cordis-wasm substrate
          # prototype, a separate repo CI does not provision. Exempt exactly
          # that reason and fail on every other skip, so the exemption cannot
          # quietly widen.
          ALLOWED = ("cordis-wasm venv not available",)
          reasons = re.findall(r'<skipped\b[^>]*?\bmessage="([^"]*)"', text)
          counted = sum(int(n) for n in re.findall(r'<testsuite\b[^>]*?\bskipped="(\d+)"', text))
          if len(reasons) != counted:
              print(f"::error::junit reports {counted} skip(s) but {len(reasons)} "
                    "skip message(s) - cannot audit them, refusing to pass")
              sys.exit(1)
          unexpected = [r for r in reasons if r not in ALLOWED]
          if unexpected:
              for reason in unexpected:
                  print(f"::error::wasm test skipped in CI: {reason}")
              print(f"::error::{len(unexpected)} wasm test(s) skipped - the tier's "
                    "runtime coverage is not actually running")
              sys.exit(1)
          for reason in reasons:
              print(f"exempt (not a wasmtime gate): {reason}")
          print(f"no wasmtime-gated wasm tests skipped ({len(reasons)} exempt)")
          PY

  backend-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable branch @ 2026-08-05; still installs the stable toolchain
      - run: pip install -e ".[test]"
      # the cargo gates resolve offline first and fall back to the networked
      # resolve when a crate is not in the local registry — which is always
      # the case on a fresh runner, so CI still fetches cordis-rs exactly as
      # before. The offline-first attempt is what lets an offline dev machine
      # with a warm ~/.cargo run these for real instead of skipping them.
      - run: pytest backends/rust/test_emit_rust.py -q
      # item 332 stage 3: the revl-gate crate's corpus gate needs cargo, so it
      # rides this job. The drift gate needs no toolchain and already runs in
      # the frontend job's plain `pytest tests/ -q`.
      - run: pytest tests/test_gate_crate_admit.py -q
      # item 333 slice 2: the rust in-process gate harness
      # (bench/inprocess_gate_rust) builds a standalone consumer of the gate
      # crate and runs it, so it needs cargo and rides this job too. It has to
      # be named HERE: its skip is a toolchain probe, not an env switch, and
      # tests/test_env_gated_skips_run_somewhere.py only catches env-var gates —
      # so without this line the skip would be the only thing that ever ran.
      - run: pytest tests/test_inprocess_gate_rust.py -q
      # item 338: the committed rust CONSUMER example
      # (examples/ecosystem-consumer-rs), built from outside the checkout with
      # the crate as its only dependency. Its source-level contract checks run
      # in the frontend job's plain `pytest tests/ -q`; the build-and-run half
      # is toolchain-gated, so it rides this job or it executes nowhere (the
      # item-445 rule: a skip is not a pass).
      - run: pytest tests/test_gate_consumer_example_rs.py -q
      # item 336 slice 1: the rust LSP binary's byte-identity agreement against
      # `python -m revl.lsp`. REVL_LSP_PYTHON points it at this job's python.
      - run: PYTHONPATH=src REVL_LSP_PYTHON=$(which python) cargo test --manifest-path crates/revl-lsp/Cargo.toml

  # Item 335: the admission gate as a wasm component, and the JS lane over it.
  # Its own job because it is the only one needing all four of cargo WITH the
  # wasm32 target, wasm-tools, wasmtime and node+jco. Before this job existed,
  # tests/test_gate_wasm_vector.py — the item's OWN exit test — skipped on every
  # runner for want of the wasm target, which is the hollow green the item-445
  # rule forbids. The skip guard at the end is what keeps it from going back.
  gate-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable branch @ 2026-08-05; still installs the stable toolchain
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[test]"
      # wasm-tools wraps the core module into a component and reads the import
      # section back off it. Pinned: the artifact under test is the thing this
      # binary produces.
      - name: Install wasm-tools (pinned)
        run: |
          curl -sSfL https://github.com/bytecodealliance/wasm-tools/releases/download/v1.257.1/wasm-tools-1.257.1-x86_64-linux.tar.gz -o /tmp/wasm-tools.tar.gz
          mkdir -p /tmp/wasm-tools
          tar -C /tmp/wasm-tools -xzf /tmp/wasm-tools.tar.gz
          echo "/tmp/wasm-tools/wasm-tools-1.257.1-x86_64-linux" >> "$GITHUB_PATH"
      - name: Install wasmtime (pinned)
        run: |
          curl -sSfL https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.3/wasmtime-v47.0.3-x86_64-linux.tar.xz -o /tmp/wasmtime.tar.xz
          mkdir -p /tmp/wasmtime
          tar -C /tmp/wasmtime -xJf /tmp/wasmtime.tar.xz
          echo "/tmp/wasmtime/wasmtime-v47.0.3-x86_64-linux" >> "$GITHUB_PATH"
      # jco transpiles the component for the browser/worker lane (slice 4).
      # Pinned to the version examples/ecosystem-consumer-js/package.json pins,
      # because the transpiled bytes are a function of it.
      - run: npm install --no-save --prefix /tmp/jco @bytecodealliance/jco@1.32.1
      # Installing the four tools is only half of it: if any download breaks,
      # every test below goes back to skipping and this job stays green. Prove
      # each binary is there first.
      - run: wasm-tools --version && wasmtime --version && /tmp/jco/node_modules/.bin/jco --version
      # The item's exit test: the wasm-compiled `admit` under wasmtime returns
      # the reference verdict, code AND message byte-identical, over the whole
      # self-host corpus — plus the empty-import property read off the artifact.
      # Then slice 4: the packaging narrows `admitted` to the literal `false`,
      # and the committed JS consumer really runs under node.
      - run: pytest tests/test_gate_wasm_vector.py tests/test_gate_consumer_example_js.py -q --junitxml=/tmp/gate-wasm-junit.xml
        env:
          REVL_JCO: /tmp/jco/node_modules/.bin/jco
      - name: no gate-wasm test may skip in CI
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          report = pathlib.Path("/tmp/gate-wasm-junit.xml")
          if not report.is_file():
              print("::error::pytest wrote no junit report - the run did not start")
              sys.exit(1)
          text = report.read_text(encoding="utf-8", errors="replace")
          reasons = re.findall(r'<skipped\b[^>]*?\bmessage="([^"]*)"', text)
          counted = sum(int(n) for n in re.findall(r'<testsuite\b[^>]*?\bskipped="(\d+)"', text))
          if len(reasons) != counted:
              print(f"::error::junit reports {counted} skip(s) but {len(reasons)} "
                    "skip message(s) - cannot audit them, refusing to pass")
              sys.exit(1)
          if reasons:
              for reason in reasons:
                  print(f"::error::gate-wasm test skipped in CI: {reason}")
              print(f"::error::{len(reasons)} test(s) skipped - the wasm gate's "
                    "coverage is not actually running")
              sys.exit(1)
          print("no gate-wasm test skipped: the component was built, run under "
                "wasmtime, transpiled and run under node")
          PY

  backend-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the javac gate compiles emitted sources against the cordis4j API
      # stubs and runs emitted test blocks on the JVM — without a JDK those
      # tests skip silently, which is how invalid Java once shipped in a
      # golden. Keep the JDK pinned here.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -e ".[test]"
      # real-runtime scenario gate: compile cordis4j-core from source and
      # point the suite at the classes (zero runtime deps, plain javac)
      - run: |
          git clone --depth 1 https://github.com/1na-ko/cordis4j.git /tmp/cordis4j
          find /tmp/cordis4j/cordis4j-core/src/main/java -name '*.java' ! -name 'module-info.java' > /tmp/core-sources.txt
          mkdir -p /tmp/cordis4j-classes
          javac --release 21 -d /tmp/cordis4j-classes @/tmp/core-sources.txt
      # THE ROOT, not one named file. This job used to run test_emit_java.py
      # alone, so backends/java/test_router_emit.py — the file asserting on the
      # very scenario whose emitted unit did not compile — had never executed in
      # CI (issue #183). Every file here now compiles what it emits through
      # backends/java/javac_gate.py, which is a no-op without the JDK installed
      # above; tests/test_java_javac_gate_runs_in_ci.py fails if either half of
      # that (the JDK, or this target) goes away.
      - run: pytest backends/java/ -q
        env:
          REVL_CORDIS4J_CLASSES: /tmp/cordis4j-classes

  backend-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: pip install -e ".[test]"
      # emitted Go is compiled and executed against the pinned stc-go runtime
      # (fetched from the module proxy on a fresh runner), mirroring how the
      # rust tier gates against cordis-rs and java against cordis4j.
      - run: pytest backends/go/test_emit_go.py -q
      - run: cd backends/go/scenarios && go test ./...
      - run: cd backends/go/v3 && go test ./...

  # The conformance matrix's second half: emitted code must survive its own
  # toolchain, not merely leave the emitter without raising. That gate
  # (tests/test_conformance_validate.py) lives in the frontend suite, where
  # only python is installed — so four of five tiers skipped there and the
  # blind spot the matrix was built to close stayed open in CI. This job is
  # the one place every tier's compiler exists at once.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable branch @ 2026-08-05; still installs the stable toolchain
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a  # v4 (v4.2.0)
      - name: Install wasmtime (pinned)
        run: |
          curl -sSfL https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.3/wasmtime-v47.0.3-x86_64-linux.tar.xz -o /tmp/wasmtime.tar.xz
          mkdir -p /tmp/wasmtime
          tar -C /tmp/wasmtime -xJf /tmp/wasmtime.tar.xz
          echo "/tmp/wasmtime/wasmtime-v47.0.3-x86_64-linux" >> "$GITHUB_PATH"
      - run: pip install -e ".[test]"
      # the typescript validator drives tsc through the compiler API, so it
      # needs the backend's own node_modules — this same install also carries
      # the cordis-ts runtime the py<->node placement seam boots on below
      - run: cd backends/typescript && npm ci
      # a tier whose validator cannot run reports `unavailable`, and
      # `--validate` still exits 0 — right on a laptop, wrong here. Fail the
      # job before the gate runs rather than let a tier go unchecked.
      - run: python3 tools/conformance.py --check-toolchains
      # the baselined gate: new toolchain rejections fail, and a baselined
      # failure that starts passing fails too, so the list can only shrink
      - run: pytest tests/test_conformance_validate.py -q
      # Roadmap item 25 — placement across the tier seams, on every commit.
      # The conformance gate above proves each tier's emitted code survives its
      # own compiler; it does NOT boot a composition SPLIT across tiers and run
      # a call over the Unix-socket bridge between them. That cross-tier seam
      # (py<->node/rust/java/go) — the one roadmap item 23's `revl swap`
      # live-migrates over — was exercised only where a dev happened to have
      # every toolchain (docs/guide-humans.md calls the running placement
      # "demonstrated, not gated"). This job is the one place all five
      # placement runtimes exist at once, so gate it here.
      #
      # `revl run --placement` spawns py-placed processes as this interpreter,
      # so the conductor needs the cordis-py runtime — install it the way the
      # `--placement` preflight itself advertises, then run the smoke under it.
      - run: sh backends/python/setup.sh
      # Roadmap item 445: the semantic floor, on every tier that exists here.
      #
      # These three files run one source on every tier and compare the VALUES,
      # which is the only gate that catches a tier that compiles and then means
      # something else. All three live in `tests/`, so they were collected by
      # `frontend` and `frontend-cordis`, and skipped nearly whole there,
      # because a tier executes only where its toolchain is installed and
      # neither job installs node_modules, cargo or a JDK. This job installs
      # all of them, so run the files HERE, where the skips actually go away.
      # test_time_coeffect.py is in the list because it carries the 17th
      # REVL_CROSS_TIER_SLOW gate (the rust async-timer lifecycle), which had
      # the same problem and is not in the cross-tier file.
      #
      # Run under the cordis-py venv (setup.sh above) so the py-runtime probes
      # execute too. Measured cost of this step is minutes, not seconds, which
      # is the whole reason for the switch below; it is proportionate for a job
      # that already provisions six toolchains, and it is the price of the
      # matrix being real rather than implied.
      #
      # ONE KNOWN SKIP IS LEFT OPEN HERE, enumerated rather than left silent.
      # test_realm_conformance.py::test_cordis4j_realm_conformance needs
      # REVL_CORDIS4J_CLASSES. That variable IS set in CI, but only in the
      # `backend-java` job, which runs backends/java/test_emit_java.py and never
      # collects tests/, so the probe skips in every job that does run it. This
      # is item 430's shape a third time: right variable, wrong job. Closing it
      # means cloning and compiling cordis4j-core here the way `backend-java`
      # already does; it is left off because it could not be run on the audit
      # machine to prove it green first, and an unverified CI step is how a red
      # build happens. Tracked on roadmap item 445 and asserted in
      # tests/test_env_gated_skips_run_somewhere.py (_KNOWN_WRONG_JOB), so it
      # cannot go quiet.
      - run: backends/python/.venv/bin/python -m pytest tests/test_cross_tier_execution.py tests/test_realm_conformance.py tests/test_time_coeffect.py -q
        env:
          # LIVE as of item 445. This turns on the rust and java probes, the
          # 17 gates that had executed in no CI job at all.
          #
          # It was staged behind the java v3 record equals/hashCode gap, which
          # is now fixed and landed on main. Verified on a real JDK 26 against
          # this branch before flipping: the full five-tier matrix is green.
          #
          # The failing probe was never deselected and the file was never
          # narrowed to make this fit. A smaller green is exactly what let
          # items 430 and 433 happen.
          REVL_CROSS_TIER_SLOW: "1"
      # ci/placement_smoke.sh boots examples/user_cache.rvl split py<->node,
      # py<->rust, py<->go and py<->java (`--once`: boot, cross the seam via a
      # probe, tear down, exit). It fails the build on a seam that will not come
      # up, a probe that errors across the bridge, or a teardown that leaves
      # residue — `--once`'s exit code alone catches only the first, so the
      # script scans the trace for the other two. The py<->java seam runs on the
      # in-repo stub runtime here (no REVL_CORDIS4J_CLASSES); it still crosses
      # the socket bridge, which is what the smoke proves. wasm has no placement
      # runner, so there is no py<->wasm seam to cover.
      - run: bash ci/placement_smoke.sh
        env:
          REVL_PY: backends/python/.venv/bin/python
      # v3.0 release gate, exit test E3: the live-systems demo (swap 23 / why 27
      # / apply 36) runs end to end from this clean checkout as a scripted gate.
      # `sh backends/python/setup.sh` above installed the cordis-py runtime the
      # live stages need, so run the scripted demo under it. REVL_DEMO_REQUIRE=1
      # turns a runtime-absent skip into a failure, so a silently-missing runtime
      # cannot let the gate pass green (the same contract as the wasm job).
      - run: backends/python/.venv/bin/python demo/live_systems/run_demo.py
        env:
          REVL_DEMO_REQUIRE: "1"

  # Roadmap item 253's exit test: the derived saga on a REAL Temporal server.
  # Every other check on the Temporal target reads emitted TEXT, which proves
  # what revl wrote and nothing about what the platform does with it. This job
  # provisions a pinned Temporal CLI (the same shape `backend-wasm` uses for
  # wasmtime, and for the same reason: a runtime nobody installs turns its
  # tests into silent skips) plus the TS SDK, boots a dev server, and runs the
  # emitter's own output against it. The gate variable is set HERE and the same
  # step runs the file that reads it, which is the pairing
  # tests/test_env_gated_skips_run_somewhere.py checks.
  temporal-exit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[test]"
      - name: Install the Temporal CLI (pinned)
        run: |
          curl -sSfL https://github.com/temporalio/cli/releases/download/v1.8.2/temporal_cli_1.8.2_linux_amd64.tar.gz -o /tmp/temporal.tar.gz
          mkdir -p /tmp/temporal
          tar -C /tmp/temporal -xzf /tmp/temporal.tar.gz
          echo "/tmp/temporal" >> "$GITHUB_PATH"
      # installing it is only half: if the download ever breaks, the test would
      # go back to failing on the toolchain rather than on revl. Prove it first.
      - run: temporal --version
      - run: cd tests/temporal_exit && npm ci
      - name: Boot a Temporal dev server and wait for it
        run: |
          temporal server start-dev --headless --ip 127.0.0.1 --port 7233 \
            --db-filename /tmp/temporal-dev.db > /tmp/temporal-dev.log 2>&1 &
          for _ in $(seq 1 60); do
            if temporal operator cluster health --address 127.0.0.1:7233 >/dev/null 2>&1; then
              echo "dev server is serving"; exit 0
            fi
            sleep 2
          done
          echo "the Temporal dev server never became healthy"; cat /tmp/temporal-dev.log; exit 1
      - run: pytest tests/test_temporal_exit_saga.py backends/typescript/test_temporal_target.py -q
        env:
          # The item-253 exit gate. Past it NOTHING skips: the test asserts on
          # node and the SDK install rather than skipping over them, so a
          # broken provisioning step above fails this job instead of quietly
          # reporting green with nothing measured (roadmap items 430/433/445).
          REVL_TEMPORAL_DEV_SERVER: "127.0.0.1:7233"

  # formal/ — the Lean backbone (formal/STATUS.md). lean-action pins the
  # toolchain via formal/lean-toolchain and runs `lake build`; the second
  # step is the axioms gate: every theorem must be axiom-free (`#print
  # axioms` may not report sorryAx or any other dependency), the
  # machine-checked form of the repo rule "a claim gets a command or it
  # gets softened". STATUS.md tracks proved/stuck/TODO per guarantee.
  formal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596  # v1 (v1.6.0)
        with:
          lake-package-directory: formal
      - name: axioms gate (no sorry, no project axioms) + harness census
        run: sh formal/scripts/run_gate.sh
