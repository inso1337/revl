# The published playground's compiler wheel must actually be built by the deploy.
#
# WHAT THIS JOB USED TO BE, AND WHY IT CHANGED (issues #252, #547).
#
# `site/vendor/revl-2.0.0-py3-none-any.whl` and its playground twin were
# COMMITTED, and this workflow checked them against a fresh build on every push
# to main. That was the right gate for the arrangement it was given: the wheel
# vendors the whole of `src/revl`, every other generated artifact here has
# automatic drift detection, and this one had none — so it was made the owner
# that cannot forget, off the per-PR path, failing loudly rather than opening a
# `GITHUB_TOKEN` PR that `ci.yml` would never run.
#
# The gate did its job. The artifact could not keep up with it. A wheel built
# against one sha is stale by the time its refresh lands several merges later,
# so the refresh always races the queue: #1095, #1103, #1115 and #1133 were each
# correct when written and red again within hours. There is no schedule of
# refreshes that closes that window, because the window is the queue.
#
# The fix was to stop committing a file that is a pure function of the tree.
# `.github/workflows/pages.yml` now builds the wheel into the artifact it
# publishes, so the deployed playground is built from the sha being deployed.
# Drift is not detected faster; it is made impossible, which is strictly
# stronger than the check it retires. `tools/check_site_wheel.py`'s header
# carries the full weighing — why a per-PR regeneration is worse here (a 2.5 MB
# non-deterministic zip conflicts by construction, and this repo lands through a
# merge queue, so the loser is an ejected PR), why a bot commit needs a standing
# credential this repo should not maintain, and what the committed copy had
# already cost (49.3 MiB of the repo's 66.0 MiB of packed blob data, 191
# revisions).
#
# WHAT THIS JOB CHECKS NOW. Building at deploy time introduces exactly one new
# way to be wrong, and it is a silent one: the deploy could stop building the
# wheel, or build it under a name the page does not fetch, and the published
# playground would 404 with nothing in the tree noticing. So this workflow keeps
# its trigger, its schedule and its teeth, and runs the same tool against that
# contract instead:
#
#   1. `pages.yml` runs a builder BEFORE it uploads `site/`.
#   2. A fresh build is named what `site/js/playground.js` and
#      `playground/app.js` fetch (a `pyproject.toml` version bump renames it).
#   3. The build's member set equals `git ls-files` of the trees it vendors,
#      asked of git rather than of the builder, so an empty or half-populated
#      zip is a red rather than a clean upload.
#
# THE FIX when this job is red is in its output and in the tool's header; it is
# a wiring defect in `pages.yml` or a rename, not an artifact to regenerate.
# There is no longer anything to commit.
#
# `site/vendor/cordis-*.whl` is NOT in scope and is still committed: its source
# is the pinned `backends/python/setup.sh` clone, absent from this tree, so it
# cannot be built at deploy time. It is gated by
# `tests/test_cordis_wheel_records_its_source_revision_1029.py`.
name: site wheel

on:
  # Every push to main. No `paths:` filter on purpose: the contract spans
  # pages.yml, the builder, pyproject's version and the two pages that fetch the
  # wheel by name — a filter listing them is one more thing that can be silently
  # wrong, and the job is a stdlib-only zip build measured in seconds against a
  # 13-job matrix that runs on the same event.
  push:
    branches: [main]
  # Backstop and manual handle: a weekly run catches a break that landed while
  # this workflow was disabled or its run was lost, and `gh workflow run "site
  # wheel"` answers "will the next deploy publish a working playground?" before
  # a release without running the rest of the gate.
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-wheel-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # No `pip install`: playground/build_wheel.py is stdlib-only and reads
      # src/revl off the checkout, so this needs no revl install and no
      # backend toolchain.
      - name: the deploy builds the wheel the playground fetches
        run: python3 tools/check_site_wheel.py
      - name: how to fix
        if: failure()
        run: |
          {
            echo "### The published playground will not boot"
            echo
            echo "The wheel is built by the Pages deploy, not committed, so"
            echo "there is nothing to regenerate here. One of three things is"
            echo "wrong; the job log above says which:"
            echo
            echo "1. \`.github/workflows/pages.yml\` no longer builds the wheel"
            echo "   before \`upload-pages-artifact\`. Restore that step."
            echo "2. \`pyproject.toml\`'s version moved, so the wheel is named"
            echo "   something \`site/js/playground.js\` and \`playground/app.js\`"
            echo "   do not fetch. Update the \`WHEEL\` constant in both."
            echo "3. The build no longer vendors what the commit tracks."
            echo
            echo "Reproduce locally with:"
            echo
            echo '```sh'
            echo 'python3 tools/check_site_wheel.py'
            echo '```'
            echo
            echo "Until it is fixed the published playground at"
            echo "<https://inso1337.github.io/revl/> is broken or stale."
          } >> "$GITHUB_STEP_SUMMARY"
