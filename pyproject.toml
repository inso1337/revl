# API stability (roadmap item 338, docs/gate-dependency-contract.md): the
# ONLY promised dependency surface for `pip install revl` is `revl.gate`
# (its `__all__`, pinned exactly by tests/test_gate_compat.py). Every other
# `revl.*` module is importable — a wheel cannot hide its modules — but
# UNVERSIONED, and may change on any release including a patch. Within
# `revl.gate`, `gate_version().api` (see src/revl/gate.py) is the semver of
# that surface itself, independent of this package's own `version` below,
# which tracks the revl LANGUAGE. See docs/gate-dependency-contract.md for
# the full consumer-facing security contract this classifier implies: a
# refusal is authoritative and fail-closed; an admission is a compile-time
# judgment scoped to `gate_version().frontier`, never a runtime sandbox.
[project]
name = "revl"
version = "2.0.0"
description = "A research language for spatiotemporal composability (Cordis paradigm)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Compilers",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio"]
# OpenTelemetry export for causal lifecycle traces (revl.otel, item 120). Kept
# out of the base install so it stays dependency-light; absent, revl.otel
# degrades to a no-op / span-mapping dump rather than a hard import error.
otel = ["opentelemetry-sdk>=1.20", "opentelemetry-api>=1.20"]

[project.scripts]
revl = "revl.__main__:main"
truc = "revl.truc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revl"]

# The per-tier emitters, runtimes and their golden data live in `backends/`, a
# sibling of `src/revl` in a checkout. They must ride *inside* the wheel or every
# backend-touching command (`revl run`, cross-tier `revl test`, placement, fault
# tests) breaks once installed — the checkout path does not exist under
# site-packages. Ship the tree as `revl/backends`; `revl._backends_root()`
# prefers the checkout location and falls back to this packaged copy.
#
# `stdlib/` ships the same way (roadmap 319): a `use "stdlib/..."` import
# needs a real directory to fall back to when it does not resolve relative to
# the importing file, and `site-packages` is exactly where an installed
# consumer (the harness, say) runs from. `revl._paths.stdlib_root()` prefers
# the checkout location and falls back to this packaged copy.
[tool.hatch.build.targets.wheel.force-include]
"backends" = "revl/backends"
"stdlib" = "revl/stdlib"

# Lint gate (roadmap 110d). The repo already carries a `# noqa` discipline whose
# codes are overwhelmingly Pyflakes (F): unused imports/locals, undefined names,
# placeholder-less f-strings. Pin ruff to that same F-level surface, not ruff's
# broader default set (E4/E7/E9 + F), so the gate enforces the discipline that
# exists without surfacing hundreds of pre-existing E/PL findings this sweep is
# not meant to litigate. Widen deliberately (its own change), never by drift.
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F"]

# roadmap item 419a: `backends/python/pytest.ini` (asyncio_mode = auto) is
# only picked up when pytest's rootdir search lands INSIDE backends/python —
# e.g. `cd backends/python && pytest`, or `pytest backends/python/tests/`
# given alone. pytest resolves exactly one inifile per session from the
# common ancestor of the given args; combine backends/python/tests/ with a
# sibling like backends/wasm/ (`pytest backends/wasm/ backends/python/tests/`)
# and the common ancestor climbs to the repo root, where this file — until
# now with no [tool.pytest.ini_options] — won, silently discarding
# backends/python/pytest.ini's asyncio_mode and reddening every unmarked
# `async def` test with "async def functions are not natively supported".
# Mirror the same setting here so a combined run stays covered regardless of
# which inifile pytest happens to pick. This is a no-op for every OTHER
# pytest invocation in the repo (`pytest tests/ -q`,
# `pytest backends/wasm/... -q`, ...): none of those trees define any
# `async def test_*` for asyncio_mode to touch.
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
