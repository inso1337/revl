[project]
name = "revl"
version = "2.0.0"
description = "A research language for spatiotemporal composability (Cordis paradigm)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revl"]
