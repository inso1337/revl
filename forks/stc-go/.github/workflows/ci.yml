name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # -fuzz 只接受单包；FuzzInterleaving 在根包
      - run: go test -run Property -fuzz FuzzInterleaving -fuzztime 10s .
