[package]
name = "revl-lsp"
version = "0.0.0"
edition = "2021"

# `preserve_order`: a Diagnostic/Hover/Location computed by the reference front
# end travels through this binary as JSON and must come out in the SAME key
# order it went in, byte for byte (see `pyjson`). Without it serde_json sorts
# object keys and the wire bytes stop matching `python -m revl.lsp`.
[dependencies]
# item 336 slice 2: the native navigation engine. The gate crate is committed
# generated source, so this dependency adds no build-time Python.
revl-gate = { path = "../revl-gate" }
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }

[[bin]]
name = "revl-lsp"
path = "src/main.rs"
