<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>revl: revertible effects, checked at compile time</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#131a28"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="violet" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- the revertible-effect loop: effect arcs out (teal), its undo arcs back (violet) -->
  <path d="M 143.2 215 A 120 120 0 0 1 355.5 188.9" fill="none" stroke="url(#teal)"
        stroke-width="26" stroke-linecap="round"/>
  <path d="M 372.4 227 L 380.4 175.1 L 330.6 202.7 z" fill="#22d3ee"/>
  <path d="M 368.8 297 A 120 120 0 0 1 156.5 323.1" fill="none" stroke="url(#violet)"
        stroke-width="26" stroke-linecap="round"/>
  <path d="M 139.6 285 L 131.6 336.9 L 181.4 309.3 z" fill="#818cf8"/>

  <!-- the component the loop belongs to -->
  <rect x="208" y="208" width="96" height="96" rx="22" fill="none" stroke="#e6edf3" stroke-width="13"/>
  <circle cx="256" cy="256" r="14" fill="#e6edf3"/>
</svg>
