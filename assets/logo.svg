<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>revl: revertible effects, checked at compile time</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b27"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <marker id="ah-teal" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2dd4bf"/>
    </marker>
    <marker id="ah-violet" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- revertible-effect loop: effect out, undo back -->
  <path d="M 152 208 A 120 120 0 0 1 360 208" fill="none" stroke="url(#teal)"
        stroke-width="26" stroke-linecap="round" marker-end="url(#ah-teal)"/>
  <path d="M 360 304 A 120 120 0 0 1 152 304" fill="none" stroke="url(#violet)"
        stroke-width="26" stroke-linecap="round" marker-end="url(#ah-violet)"/>

  <!-- the component the effects belong to -->
  <rect x="206" y="206" width="100" height="100" rx="24" fill="none" stroke="#e6edf3" stroke-width="13"/>
  <circle cx="256" cy="256" r="15" fill="#e6edf3"/>
</svg>
